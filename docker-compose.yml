# ReAdmin — full self-hosted stack for a single VPS.
#
#   caddy   the only container on 80/443; terminates TLS, routes by hostname
#   panel   Next.js UI + SSR
#   api     Fastify (tRPC, in-game REST, Discord/Stripe webhooks)
#   sync    node-cron worker — MUST stay at exactly one replica
#   mongo   redis   minio     datastores, reachable only on the internal network
#
# Nothing but caddy publishes a host port. The datastores are addressed by
# service name over the compose network and are not reachable from the internet.

x-app: &app
  build:
    context: .
    secrets:
      - dotenv
  image: readmin:latest
  env_file: .env
  depends_on:
    mongo:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  panel:
    <<: *app
    command: npm run start
    environment:
      PORT: 3000
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  api:
    <<: *app
    command: npm run fastify:start
    environment:
      PORT: 3001
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  # The cron jobs are not sharded — a second replica would duplicate ranking
  # actions, DMs and distributions. Do not scale this service.
  sync:
    <<: *app
    command: npm run sync:start
    deploy:
      replicas: 1

  mongo:
    image: mongo:8
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?set MONGO_ROOT_USER in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in .env}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # S3-compatible storage, standing in for DigitalOcean Spaces.
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${CDN_ACCESS_KEY_ID:?set CDN_ACCESS_KEY_ID in .env}
      MINIO_ROOT_PASSWORD: ${CDN_SECRET_ACCESS_KEY:?set CDN_SECRET_ACCESS_KEY in .env}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot: creates the bucket and makes it public-read, then exits. The
  # panel serves avatars and preview images straight from cdn.<domain>, so the
  # objects must be readable without a signature.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    env_file: .env
    entrypoint: >
      sh -c "
      mc alias set local http://minio:9000 $$CDN_ACCESS_KEY_ID $$CDN_SECRET_ACCESS_KEY &&
      mc mb --ignore-existing local/$$CDN_BUCKET_NAME &&
      mc anonymous set download local/$$CDN_BUCKET_NAME
      "
    restart: "no"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    env_file: .env
    depends_on:
      - panel
      - api
      - minio

secrets:
  dotenv:
    file: .env

volumes:
  mongo-data:
  redis-data:
  minio-data:
  caddy-data:
  caddy-config:
